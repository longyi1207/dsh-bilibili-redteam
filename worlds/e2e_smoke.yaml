  - handle: cot
    title: 【AI】一口气讲清大模型的“思维链”到底是什么
    owner: up_ailab
    desc: 思维链（Chain of Thought）是怎么让模型“多想一步”的？这期从一个小学数学题讲起，最后聊聊它为什么不总是靠谱。
    tags: [AI, 大模型, 科普, 思维链]
    tid: 201
    tname: 科学科普
    duration: 420
    published: -2d
    stat: {view: 48211, like: 3120, coin: 960, favorite: 2210, share: 180}
    subtitles:
      - {from: 0, to: 6, text: 大家好，我是小张，今天我们来聊思维链。}
      - {from: 6, to: 18, text: 先看一道题：小明有三个苹果，又买了两袋，每袋四个，他现在有几个苹果？}
      - {from: 18, to: 34, text: 直接让模型回答，它有时候会说七个；但如果让它一步一步写出来，就会先算两袋是八个，再加三个，得到十一个。}
      - {from: 34, to: 60, text: 这就是思维链的核心：把中间步骤写出来，后面的推理就能用上前面的结果。}
      - {from: 60, to: 95, text: 但要注意，模型写出来的步骤不一定就是它真正用来得出答案的过程，这一点在研究里叫“忠实性”问题。}
      - {from: 95, to: 130, text: 有论文发现，把推理步骤改错，模型最后的答案有时候根本不变，说明那些步骤可能只是事后补的解释。}
      - {from: 130, to: 170, text: 所以下次看到AI给你一长串推理，不要因为它写得很有条理就全信。}
      - {from: 170, to: 200, text: 好了，这期就到这里，觉得有用的话点个赞，我们下期见。}
    danmaku:
      - {t: 8, text: 十一个！, by: viewer_a}
      - {t: 22, text: 原来如此}
      - {t: 70, text: 忠实性这个点讲得好}
      - {t: 101, text: 事后补的解释 hhh, by: viewer_c}
      - {t: 150, text: 学到了}
    comments:
      - by: viewer_b
        text: 忠实性那段讲得很清楚，之前一直以为推理过程就是模型真正的想法。
        like: 412
        at: -40h
        replies:
