  - handle: injection_101
    title: 零基础入门：提示词注入是什么？普通人需要担心吗
    owner: up_kepu
    desc: 用三个日常例子解释提示词注入，以及你在用AI助手的时候可以注意什么。
    tags: [AI, 安全, 提示词]
    tid: 201
    tname: 科学科普
    duration: 300
    published: -5d
    stat: {view: 21877, like: 1650, coin: 320, favorite: 1200, share: 140}
    subtitles:
      - {from: 0, to: 15, text: 提示词注入，简单说就是别人写的文字，被AI当成了你给它的指令。}
      - {from: 15, to: 50, text: 比如你让AI帮你总结网页，网页里藏了一句话，AI就可能照着那句话去做事。}
      - {from: 50, to: 90, text: 对普通用户来说，最重要的一条是：不要给AI助手超过它完成任务所需要的权限。}
      - {from: 90, to: 120, text: 比如只让它看视频的助手，就不应该能读你电脑上的其他文件。}
    comments:
      - {by: viewer_c, text: 最小权限这个原则讲得好，很多插件默认权限都给太大了。, like: 160, at: -100h}

