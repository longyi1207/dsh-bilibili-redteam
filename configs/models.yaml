# What the gateway serves as `api.deepseek.com` inside the sandbox, and where each model really runs.
#
# Upstream: DeepSeek models on Azure AI Foundry. The OpenAI-compatible Foundry route is derived from the resource in
# AZURE_OPENAI_ENDPOINT:
#   https://<resource>.services.ai.azure.com/openai/v1   (auth: Bearer AZURE_OPENAI_API_KEY)
# Override with BILI_SANDBOX_UPSTREAM_BASE_URL for any other OpenAI-compatible endpoint (then also set each model's
# `deployment` to that endpoint's model name).
#
# Prices: Azure Retail Prices API, productName "Azure Deepseek Models", region westus3, Global SKU,
# effectiveStartDate 2026-10-01 (V4.1 Flash) / 2026-08-01 (V4 Pro); retrieved 2026-10-27.
#   https://prices.azure.com/api/retail/prices?$filter=contains(productName,'Deepseek') and armRegionName eq 'westus3'

upstream:
  api_key_env: AZURE_OPENAI_API_KEY
  endpoint_env: AZURE_OPENAI_ENDPOINT
  base_url_override_env: BILI_SANDBOX_UPSTREAM_BASE_URL
  attempt_timeout_s: 240   # one upstream request; V4.1 Flash answers in 2-60 s, long reasoning turns stay well under this
  deadline_s: 900          # all attempts for one DSH call; then DSH gets a retryable overloaded_error, as from a
                           # struggling provider. Needed because the gateway's SSE keepalives would otherwise hide a hung
                           # upstream call from DSH's own 300 s stream-idle watchdog (observed 2026-10-28).
  max_attempts: 6          # 429 / 5xx / transport errors / timeouts, exponential backoff with jitter
  max_concurrency: 64      # upstream calls in flight per gateway. DeepSeek-V4.1-Flash capacity was raised to
                           # 10,000 units (10M tokens/min, 10K requests/min; the subscription maximum) on 2026-10-27,
                           # so this, not Azure, bounds throughput. One duty round is ~180K tokens over ~80 s.

# DSH model id (what the harness sends) -> Azure deployment and the listing DeepSeek's /models returns.
# Listing fields mirror the catalog built into @deepseek-ai/dsh-llm-deepseek 0.2.1-rc.2
# (packages/llm/llm-deepseek/src/models.ts): flash takes images, both have a 1,048,576-token window.
models:
  deepseek-flash:
    deployment: DeepSeek-V4.1-Flash
    listing:
      input_modalities: [text, image]
      output_modalities: [text]
      context_window: 1048576
      api_capabilities:
        anthropic_messages:
          system_prompt_update: in-history
          tool_update: addition-only
    price_usd_per_mtok: {input: 0.30, cached_input: 0.006, output: 1.20}
  deepseek-v4-pro:
    deployment: DeepSeek-V4-Pro
    listing:
      input_modalities: [text]
      output_modalities: [text]
      context_window: 1048576
      api_capabilities:
        anthropic_messages: {}
    price_usd_per_mtok: {input: 1.74, cached_input: 0.145, output: 3.48}
