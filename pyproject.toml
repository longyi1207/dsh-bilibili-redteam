[project]
name = "bili-sandbox"
version = "0.1.0"
description = "Offline red-team sandbox: real DeepSeek Harness + real dsh-bili-scroll agents against a simulated Bilibili"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "cryptography>=43",
    "openai>=1.60",
    "pillow>=11",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
bili-sandbox = "bili_sandbox.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.3",
    "pytest-aiohttp>=1.0",
    "qrcode>=8.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
